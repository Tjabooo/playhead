[package]
name = "playhead"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A BitTorrent engine built for streaming: deadline piece picking around the playhead, seekable HTTP range server, and a fail-closed VPN interface binding."
license = "MIT"
repository = "https://github.com/Tjabooo/playhead"
readme = "README.md"
keywords = ["bittorrent", "streaming", "torrent", "vpn", "http"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
clap = { version = "4", features = ["derive"] }
if-addrs = "0.13"
rand = "0.9"
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
